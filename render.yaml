# Render Blueprint for the back end (the Java API). Paid "starter" plan: always on, no sleeping.
# In Render: New → Blueprint → pick this repository. Render reads this file and asks only for the
# values marked "sync: false". Nothing secret is stored in this file.
#
# Starter plan: 512 MB memory, always on (no sleeping), billed monthly. To go back to the free plan
# (sleeps after 15 minutes without visitors, a minute or more to wake), set "plan" below to free.
services:
  - type: web
    name: lupin-api
    runtime: docker
    plan: starter
    region: frankfurt
    rootDir: backend
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    healthCheckPath: /actuator/health
    autoDeployTrigger: commit
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: production
      # Sized for 512 MB. Measured locally on 2026-11-11 with exactly these options: the API started,
      # answered 300 of 300 requests and used about 285-385 MB in total.
      - key: JAVA_TOOL_OPTIONS
        value: "-Xmx200m -XX:MaxMetaspaceSize=140m -XX:ReservedCodeCacheSize=40m -XX:+UseSerialGC -Xss512k -XX:TieredStopAtLevel=1 -XX:+ExitOnOutOfMemoryError"
      - key: DATABASE_POOL_SIZE
        value: "3"
      - key: LUPIN_PUBLIC_BASE_URL
        value: https://lupinwear.store

      # Generated by Render on first creation; never shown in this repository.
      - key: LUPIN_JWT_SECRET
        generateValue: true
      # The storefront Worker must be given this same value (EDGE_SHARED_SECRET). Copy it from the
      # service's Environment page in Render.
      - key: LUPIN_EDGE_SECRET
        generateValue: true
      # Bosta sends delivery updates with this value in a header; the app checks it. Never shared.
      - key: BOSTA_WEBHOOK_SECRET
        generateValue: true

      # Bosta courier. Create the API key in Bosta's dashboard (Settings → API integration, Read/Write)
      # and paste it on Render's Environment page. Leave empty to keep Bosta switched off.
      - key: BOSTA_API_KEY
        sync: false
      # Optional: the pickup location id from Bosta when the business has more than one.
      - key: BOSTA_BUSINESS_LOCATION_ID
        sync: false

      # Asked for once, when the Blueprint is created. Paste Neon's connection string exactly as Neon
      # shows it (postgresql://user:password@host/neondb?sslmode=require); use the one WITHOUT
      # "-pooler" in the host. The app splits it into address, user and password itself.
      - key: DATABASE_URL
        sync: false
      # First staff login. Remove both from the Environment page after the first successful sign-in.
      - key: LUPIN_BOOTSTRAP_OWNER_EMAIL
        sync: false
      - key: LUPIN_BOOTSTRAP_OWNER_PASSWORD
        sync: false
