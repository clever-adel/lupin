spring:
  application:
    name: lupin-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/lupin}
    username: ${DATABASE_USERNAME:lupin}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:8}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs

lupin:
  security:
    # Base64, at least 32 random bytes. No default on purpose: the app refuses to start without it.
    jwt-secret: ${LUPIN_JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    cookie-secure: true
    allowed-origins: ${LUPIN_ALLOWED_ORIGINS:}
    max-failed-logins: 5
    lockout-base: 15m
    # Shared with the storefront Worker (its EDGE_SHARED_SECRET). Required in staging and production:
    # requests without it are refused, so the API cannot be reached around the Worker.
    edge-secret: ${LUPIN_EDGE_SECRET:}
  bootstrap:
    owner-email: ${LUPIN_BOOTSTRAP_OWNER_EMAIL:}
    owner-password: ${LUPIN_BOOTSTRAP_OWNER_PASSWORD:}
  # Public address of the storefront; used for Paymob's redirect and webhook addresses.
  public-base-url: ${LUPIN_PUBLIC_BASE_URL:https://lupinwear.store}
  jobs:
    enabled: true
  # Online payments stay switched off until all three keys are present. Keys come from the environment only.
  paymob:
    secret-key: ${PAYMOB_SECRET_KEY:}
    public-key: ${PAYMOB_PUBLIC_KEY:}
    hmac-secret: ${PAYMOB_HMAC_SECRET:}
    integration-card: ${PAYMOB_INTEGRATION_ID_CARD:}
    integration-wallet: ${PAYMOB_INTEGRATION_ID_WALLET:}
    integration-fawry: ${PAYMOB_INTEGRATION_ID_FAWRY:}
    intention-url: ${PAYMOB_INTENTION_URL:https://accept.paymob.com/v1/intention/}
    checkout-url: ${PAYMOB_CHECKOUT_URL:https://accept.paymob.com/unifiedcheckout/}

---
spring:
  config:
    activate:
      on-profile: local
  flyway:
    locations: classpath:db/migration,classpath:db/devdata
lupin:
  security:
    cookie-secure: false
    allowed-origins: http://localhost:5173
  public-base-url: http://localhost:5173
springdoc:
  swagger-ui:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: staging

---
spring:
  config:
    activate:
      on-profile: production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
