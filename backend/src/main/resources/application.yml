spring:
  application:
    name: lupin-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/lupin}
    username: ${DATABASE_USERNAME:lupin}
    password: ${DATABASE_PASSWORD:}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:8}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null
  threads:
    virtual:
      enabled: true

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never

springdoc:
  api-docs:
    path: /api/v1/openapi
  swagger-ui:
    path: /api/v1/docs

lupin:
  security:
    # Base64, at least 32 random bytes. No default on purpose: the app refuses to start without it.
    jwt-secret: ${LUPIN_JWT_SECRET}
    access-token-ttl: 15m
    refresh-token-ttl: 30d
    cookie-secure: true
    allowed-origins: ${LUPIN_ALLOWED_ORIGINS:}
    max-failed-logins: 5
    lockout-base: 15m
    # Shared with the storefront Worker (its EDGE_SHARED_SECRET). Required in staging and production:
    # requests without it are refused, so the API cannot be reached around the Worker.
    edge-secret: ${LUPIN_EDGE_SECRET:}
  bootstrap:
    owner-email: ${LUPIN_BOOTSTRAP_OWNER_EMAIL:}
    owner-password: ${LUPIN_BOOTSTRAP_OWNER_PASSWORD:}
  # Public address of the storefront; used for Paymob's redirect and webhook addresses.
  public-base-url: ${LUPIN_PUBLIC_BASE_URL:https://lupinwear.store}
  jobs:
    enabled: true
  # "Continue with Google". The client ID is public (Google Cloud project lupin-store, web client
  # "Lupin."); the secret comes from the environment. Off until the secret is present.
  google:
    client-id: ${GOOGLE_CLIENT_ID:531304085676-69ir1l2mgopbq283vdacct77re4ofb64.apps.googleusercontent.com}
    client-secret: ${GOOGLE_CLIENT_SECRET:}
  # New-order alerts on WhatsApp (Meta WhatsApp Cloud API). Off until the token and the sender's
  # phone number ID are present. The template must be approved by Meta (see NewOrderNotifier).
  whatsapp:
    token: ${WHATSAPP_TOKEN:}
    phone-number-id: ${WHATSAPP_PHONE_NUMBER_ID:}
    template: ${WHATSAPP_TEMPLATE:new_order}
    template-lang: ${WHATSAPP_TEMPLATE_LANG:ar}
  # Outgoing email ("forgot password" links) through Resend. Nothing is sent until the key is present.
  # The sender's domain must be verified in Resend (DNS records on lupinwear.store).
  mail:
    resend-api-key: ${RESEND_API_KEY:}
    from: ${LUPIN_MAIL_FROM:LUPIN <no-reply@lupinwear.store>}
    log-links: false
  # Online payments stay switched off until all three keys are present. Keys come from the environment only.
  paymob:
    secret-key: ${PAYMOB_SECRET_KEY:}
    public-key: ${PAYMOB_PUBLIC_KEY:}
    hmac-secret: ${PAYMOB_HMAC_SECRET:}
    integration-card: ${PAYMOB_INTEGRATION_ID_CARD:}
    integration-wallet: ${PAYMOB_INTEGRATION_ID_WALLET:}
    integration-fawry: ${PAYMOB_INTEGRATION_ID_FAWRY:}
    intention-url: ${PAYMOB_INTENTION_URL:https://accept.paymob.com/v1/intention/}
    checkout-url: ${PAYMOB_CHECKOUT_URL:https://accept.paymob.com/unifiedcheckout/}
  # AI model photos for "shop the look" (FASHN virtual try-on). Off until the key is present; the key
  # stays on the server. candidates = how many alternative photos one run makes (1 to 4, billed each).
  tryon:
    fashn-api-key: ${FASHN_API_KEY:}
    fashn-base-url: ${FASHN_BASE_URL:https://api.fashn.ai/v1}
    candidates: ${FASHN_CANDIDATES:2}
    local-preview: false
  # Bosta courier. Switched off until the API key and a webhook secret (24+ characters) are both present.
  bosta:
    api-key: ${BOSTA_API_KEY:}
    webhook-secret: ${BOSTA_WEBHOOK_SECRET:}
    base-url: ${BOSTA_BASE_URL:https://app.bosta.co/api/v2}
    business-location-id: ${BOSTA_BUSINESS_LOCATION_ID:}
    package-type: ${BOSTA_PACKAGE_TYPE:Small}

---
spring:
  config:
    activate:
      on-profile: local
  flyway:
    locations: classpath:db/migration,classpath:db/devdata
lupin:
  security:
    cookie-secure: false
    allowed-origins: http://localhost:5173
  public-base-url: http://localhost:5173
  # Without a Resend key, local runs print emails (with their links) to the log.
  mail:
    log-links: true
  # Without a FASHN key, local runs make clearly labelled test boards instead of AI photos.
  tryon:
    local-preview: true
springdoc:
  swagger-ui:
    enabled: true

---
spring:
  config:
    activate:
      on-profile: staging

---
spring:
  config:
    activate:
      on-profile: production
springdoc:
  api-docs:
    enabled: false
  swagger-ui:
    enabled: false
