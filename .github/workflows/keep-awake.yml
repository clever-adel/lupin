name: Keep the API awake

# Render's free plan puts the API to sleep after 15 minutes without visits, and waking it takes minutes
# (the store says "not reachable" meanwhile). A light health check every 10 minutes keeps it awake.
# Not needed on a paid Render plan: delete this file then. GitHub may run scheduled jobs a few minutes
# late, and pauses them after 60 days without any commit to the repository.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API health check
        run: |
          for attempt in 1 2 3; do
            if curl -fsS --max-time 90 https://lupin-api-racc.onrender.com/actuator/health; then exit 0; fi
            sleep 20
          done
          echo "::warning::The API did not answer its health check."
